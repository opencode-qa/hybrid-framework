name: ✨ Feature Request
description: Suggest an enhancement or new feature for the framework.
title: "[FEAT] <Short description of the feature>"
labels: ["enhancement", "triage"]
assignees:
  - Anuj-Patiyal
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please check the `milestones.json` or project board to ensure this feature isn't already planned.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
