name: "📦 Feature Branch – Full Validation"

on:
  push:
    branches:
      - 'feature/*'
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'scripts/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/features/**'
      - '.github/releases/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-validation:
    name: "⚙️ Build, Test & Quality"
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v5

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 🛠️ Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: 📝 Validate POM (strict)
        run: |
          chmod +x ./scripts/pom-validator.sh
          ./scripts/pom-validator.sh --strict

      - name: 🔨 Build & Test (Maven verify)
        run: mvn -B clean verify

      - name: ✅ Run Checkstyle (code quality)
        run: mvn checkstyle:check

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v5
        if: always()
        continue-on-error: true
        with:
          name: test-results-feature-${{ github.sha }}
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7
