name: "SemVer Release Automation"

on:
  workflow_run:
    workflows: ["Main CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (auto, major, minor, patch)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
      custom_version:
        description: 'Override: specific version (e.g., 1.2.3). Leave empty to use auto/bump.'
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: true

env:
  GPG_TTY: $(tty)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "::error::Secret GH_PAT is missing"
            exit 1
          fi
          if [ -z "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "::error::Secret GPG_PRIVATE_KEY is missing"
            exit 1
          fi
          if [ -z "${{ secrets.GPG_KEY_ID }}" ]; then
            echo "::error::Secret GPG_KEY_ID is missing"
            exit 1
          fi
          if [ -z "${{ secrets.GPG_PASSPHRASE }}" ]; then
            echo "::error::Secret GPG_PASSPHRASE is missing"
            exit 1
          fi
          echo "✓ All secrets are present"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Import GPG key
        run: |
          printf '%s\n' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          mkdir -p ~/.gnupg
          echo "use-agent" > ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye

      - name: Configure git and GitHub CLI
        run: |
          git config user.name "Release Automation"
          git config user.email "release-automation@users.noreply.github.com"
          git config commit.gpgsign true
          git config user.signingkey ${{ secrets.GPG_KEY_ID }}
          gh auth login --with-token <<< "${{ secrets.GH_PAT }}"

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags origin
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "Latest tag: $LATEST_TAG"

          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            NEXT_VERSION="${{ github.event.inputs.custom_version }}"
            echo "Using custom version: $NEXT_VERSION"
          else
            BUMP="${{ github.event.inputs.version_bump || 'auto' }}"
            if [ "$BUMP" != "auto" ]; then
              if [ "$LATEST_TAG" = "none" ]; then
                MAJ=0; MIN=0; PAT=0
              else
                IFS='.' read -r MAJ MIN PAT <<< "${LATEST_TAG#v}"
              fi
              case "$BUMP" in
                major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
                minor) MIN=$((MIN+1)); PAT=0 ;;
                patch) PAT=$((PAT+1)) ;;
              esac
              NEXT_VERSION="$MAJ.$MIN.$PAT"
            else
              if [ "$LATEST_TAG" = "none" ]; then
                NEXT_VERSION="0.0.0"
              else
                COMMITS=$(git log "$LATEST_TAG"..HEAD --pretty=format:"%s")
                if echo "$COMMITS" | grep -qiE "BREAKING CHANGE|^major:"; then
                  INCR="major"
                elif echo "$COMMITS" | grep -qiE "^feat|^minor:"; then
                  INCR="minor"
                else
                  INCR="patch"
                fi
                IFS='.' read -r MAJ MIN PAT <<< "${LATEST_TAG#v}"
                case "$INCR" in
                  major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
                  minor) MIN=$((MIN+1)); PAT=0 ;;
                  patch) PAT=$((PAT+1)) ;;
                esac
                NEXT_VERSION="$MAJ.$MIN.$PAT"
              fi
            fi
          fi

          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=v$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "✓ Next version: $NEXT_VERSION"

      - name: Verify tag does not exist
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.new_tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.new_tag }} already exists"
            exit 1
          fi

      - name: Determine release type
        id: type
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$LATEST_TAG" = "none" ]; then
            echo "release_type=major_minor" >> $GITHUB_OUTPUT
          else
            IFS='.' read -r LAT_MAJ LAT_MIN LAT_PAT <<< "${LATEST_TAG#v}"
            IFS='.' read -r NEW_MAJ NEW_MIN NEW_PAT <<< "${{ steps.version.outputs.next_version }}"
            if [ $NEW_MAJ -gt $LAT_MAJ ] || [ $NEW_MIN -gt $LAT_MIN ]; then
              echo "release_type=major_minor" >> $GITHUB_OUTPUT
            else
              echo "release_type=patch" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create release/hotfix branch
        run: |
          if [ "${{ steps.type.outputs.release_type }}" = "major_minor" ]; then
            git checkout dev
            git pull origin dev
            BRANCH_NAME="release/${{ steps.version.outputs.next_version }}"
          else
            git checkout main
            git pull origin main
            BRANCH_NAME="hotfix/${{ steps.version.outputs.next_version }}"
          fi
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Update pom.xml
        run: |
          NEW_VER="${{ steps.version.outputs.next_version }}"
          CURRENT_VER=$(grep -oP '(?<=<version>).*(?=</version>)' pom.xml | head -1)
          mvn versions:set -DnewVersion="$NEW_VER" -DgenerateBackupPoms=false || \
            perl -pi -e "s|$CURRENT_VER|$NEW_VER|g" pom.xml
          if ! grep -q "<version>$NEW_VER</version>" pom.xml; then
            echo "::error::Failed to update pom.xml"
            exit 1
          fi

      - name: Commit and push
        run: |
          git add pom.xml
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --yes --output /dev/null --clear-sign /dev/null
          git commit -S -m "release: prepare ${{ steps.version.outputs.next_version }}"
          git push -u origin "${{ env.BRANCH_NAME }}"

      - name: Create Pull Request
        id: create_pr
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "${{ env.BRANCH_NAME }}" \
            --title "Release ${{ steps.version.outputs.next_version }}" \
            --body "Automated release PR for version ${{ steps.version.outputs.next_version }}. Merge after all checks pass." \
            --label "release")
          echo "PR_URL=$PR_URL" >> $GITHUB_OUTPUT
          PR_NUMBER=$(echo "$PR_URL" | grep -oP '(?<=/pull/)\d+')
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Wait for PR merge (3 hours timeout)
        run: |
          PR_NUMBER="${{ steps.create_pr.outputs.PR_NUMBER }}"
          TIMEOUT=10800   # 3 hours
          INTERVAL=30
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
            if [ "$STATE" = "MERGED" ]; then
              echo "PR #$PR_NUMBER merged."
              exit 0
            elif [ "$STATE" = "CLOSED" ]; then
              echo "::error::PR #$PR_NUMBER was closed without merge."
              exit 1
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED+INTERVAL))
          done
          echo "::error::Timeout waiting for PR merge after 3 hours."
          exit 1

      - name: Create tag and release
        run: |
          git checkout main
          git pull origin main
          TAG="${{ steps.version.outputs.new_tag }}"
          git tag -s "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes "Automated release based on commit history." \
            --verify-tag
          echo "✓ Tag and GitHub Release created on main"

      - name: Sync dev branch
        run: |
            git checkout dev
            git pull origin dev
            git merge main --no-edit || {
            echo "::error::Merge conflict when merging main into dev. Resolve manually and push."
            exit 1
            }

            # Always bump dev to the next minor SNAPSHOT after any release
            # (patch releases also advance dev to next minor)
            IFS='.' read -r MAJ MIN PAT <<< "${{ steps.version.outputs.next_version }}"
            NEXT_SNAPSHOT="$MAJ.$((MIN+1)).0-SNAPSHOT"

            CURRENT_DEV_VER=$(grep -oP '(?<=<version>).*(?=</version>)' pom.xml | head -1)
            echo "Current dev version: $CURRENT_DEV_VER"
            echo "Setting dev to: $NEXT_SNAPSHOT"

            mvn versions:set -DnewVersion="$NEXT_SNAPSHOT" -DgenerateBackupPoms=false || \
              perl -pi -e "s|$CURRENT_DEV_VER|$NEXT_SNAPSHOT|g" pom.xml

            # Verify the change
            if grep -q "<version>$NEXT_SNAPSHOT</version>" pom.xml; then
              echo "✓ pom.xml updated to $NEXT_SNAPSHOT"
            else
              echo "::error::Failed to update pom.xml to snapshot version"
              exit 1
            fi

            git add pom.xml
            git commit -S -m "chore: bump dev to $NEXT_SNAPSHOT"
            git push origin dev

      - name: Cleanup branch
        if: always()
        run: |
          git push origin --delete "${{ env.BRANCH_NAME }}" 2>/dev/null || true
